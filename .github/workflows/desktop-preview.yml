name: Desktop preview installers

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths: ['desktop/**', '.github/workflows/desktop-preview.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-preview.yml']

permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    name: ${{ matrix.platform }} x64
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libxss1 libasound2 libgbm1 libsecret-1-0 libfuse2
      - run: npm ci
      - run: npm test
      - name: Electron integration smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run test:electron
      - name: Electron integration smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:electron
      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        run: npm run dist:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Linux AppImage and Debian installers
        if: runner.os == 'Linux'
        run: npm run dist:linux
      - run: npm run checksums
      - name: Verify Debian metadata and AppImage runtime
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --info dist/*.deb
          chmod +x dist/*.AppImage
          dist/*.AppImage --appimage-version
      - uses: actions/upload-artifact@v4
        with:
          name: focus-studio-desktop-${{ matrix.platform }}-x64
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
