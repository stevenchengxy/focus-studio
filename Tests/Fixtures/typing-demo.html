<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Typing zoom test · Focus Studio</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: #f4f5f9; color: #191c2b; font: 17px -apple-system, sans-serif }
  header { padding: 28px 42px; background: white; border-bottom: 1px solid #dedfec; font-weight: 700 }
  main { max-width: 900px; margin: 50px auto; padding: 0 28px }
  .card { background: white; border: 1px solid #dedfec; border-radius: 20px; padding: 36px }
  .label { font-size: 12px; color: #7065e7; letter-spacing: 2px; font-weight: 700 }
  h1 { margin-top: 14px; font-size: 34px }
  p { color: #666b80; line-height: 1.6 }
  label { display: block; margin: 28px 0 12px; font-weight: 600 }
  textarea { width: 100%; min-height: 180px; padding: 20px; font: inherit; line-height: 1.6; border: 2px solid #b1a9fc; border-radius: 12px; resize: none; outline-color: #7667ee }
  footer { margin-top: 20px; color: #888da0; font-size: 13px }
</style>
<header>Focus Studio · Local demo fixture</header>
<main><div class="card">
  <div class="label">PRODUCT DEMO</div>
  <h1>Keep the conversation in focus.</h1>
  <p>Type for several seconds. The recording should hold its zoom on this message box until typing stops, then ease back out.</p>
  <label for="message">Demo message</label>
  <textarea id="message" aria-label="Demo message" placeholder="Type a harmless demo message here…"></textarea>
  <footer>This local page has no network requests, submission, analytics, or storage.</footer>
</div></main>
</html>
